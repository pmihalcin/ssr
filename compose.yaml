services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Tokens always carry the browser-facing issuer, while containers can still
      # reach Keycloak on its service name for discovery and keys.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/ssr-realm.json:/opt/keycloak/data/import/ssr-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./services/api
    environment:
      Keycloak__Authority: http://localhost:8080/realms/ssr
      Keycloak__MetadataAddress: http://keycloak:8080/realms/ssr/.well-known/openid-configuration
      Keycloak__RequireHttpsMetadata: "false"
    ports:
      - "5100:8080"
    depends_on:
      keycloak:
        condition: service_healthy

  csr:
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    environment:
      Oidc__Authority: http://localhost:8080/realms/ssr
      Oidc__MetadataAddress: http://keycloak:8080/realms/ssr/.well-known/openid-configuration
      Oidc__RequireHttpsMetadata: "false"
      Api__BaseAddress: http://api:8080
      # The stack is served over plain http on localhost.
      Session__InsecureCookies: "true"
    ports:
      - "5200:8080"
    depends_on:
      - api

  ssr:
    build:
      context: .
      dockerfile: apps/ssr/Dockerfile
    environment:
      # Demo-only secret that encrypts the session cookie.
      AUTH_SECRET: ssr-app-demo-secret-change-me-0123456789
      AUTH_URL: http://localhost:3000
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ssr
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/ssr
      KEYCLOAK_CLIENT_ID: ssr-app
      KEYCLOAK_CLIENT_SECRET: ssr-app-secret
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_started
