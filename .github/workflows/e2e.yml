name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ssr/e2e exec playwright install --with-deps chromium
      - run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Wait for both apps
        run: |
          curl --retry 60 --retry-delay 2 --retry-all-errors --fail --silent --output /dev/null http://localhost:5200/
          curl --retry 60 --retry-delay 2 --retry-all-errors --fail --silent --output /dev/null http://localhost:3000/login
      - run: pnpm --filter @ssr/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()
