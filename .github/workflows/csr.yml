name: CSR

on:
  push:
    branches: [main]
    paths: [apps/csr/**, packages/ui/**, services/bff/**, pnpm-lock.yaml, .github/workflows/csr.yml]
  pull_request:
    paths: [apps/csr/**, packages/ui/**, services/bff/**, pnpm-lock.yaml, .github/workflows/csr.yml]

jobs:
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ssr/ui typecheck
      - run: pnpm --filter @ssr/ui test
      - run: pnpm --filter @ssr/csr typecheck
      - run: pnpm --filter @ssr/csr test
      - run: pnpm --filter @ssr/csr build
